# Basic Audio Augmentation Configuration for Twi Speech Recognition
# This configuration defines basic audio augmentation techniques for training

augmentation:
  # Enable/disable augmentation
  enabled: true

  # Probability of applying augmentation to each sample
  augmentation_prob: 0.5

  # Audio augmentations
  audio:
    # Gaussian noise addition
    gaussian_noise:
      enabled: true
      probability: 0.3
      min_amplitude: 0.001
      max_amplitude: 0.015

    # Time stretching (speed perturbation)
    time_stretch:
      enabled: true
      probability: 0.4
      min_rate: 0.8
      max_rate: 1.2

    # Pitch shifting
    pitch_shift:
      enabled: true
      probability: 0.3
      min_semitones: -2
      max_semitones: 2

    # Time shifting
    time_shift:
      enabled: true
      probability: 0.4
      min_fraction: -0.2
      max_fraction: 0.2

    # Volume perturbation
    volume_perturbation:
      enabled: true
      probability: 0.4
      min_factor: 0.7
      max_factor: 1.3

    # Background noise
    background_noise:
      enabled: false # Disabled by default for basic config
      probability: 0.2
      noise_dir: null
      min_snr_db: 10
      max_snr_db: 30

    # Reverb
    reverb:
      enabled: false # Disabled by default for basic config
      probability: 0.2
      room_size: 0.5
      damping: 0.5

    # Frequency masking (SpecAugment)
    freq_mask:
      enabled: true
      probability: 0.3
      num_masks: 2
      max_mask_length: 10

    # Time masking (SpecAugment)
    time_mask:
      enabled: true
      probability: 0.3
      num_masks: 2
      max_mask_length: 50

  # Text augmentations (for transcriptions)
  text:
    # Synonym replacement
    synonym_replacement:
      enabled: false # Disabled for basic config
      probability: 0.1
      num_replacements: 1

    # Random insertion
    random_insertion:
      enabled: false # Disabled for basic config
      probability: 0.1
      num_insertions: 1

    # Random deletion
    random_deletion:
      enabled: false # Disabled for basic config
      probability: 0.1

    # Random swap
    random_swap:
      enabled: false # Disabled for basic config
      probability: 0.1
      num_swaps: 1

# Twi-specific augmentation strategies
twi_specific:
  # Dialect variation simulation
  dialect_variation:
    enabled: false # Disabled for basic config
    probability: 0.2
    dialects: ["Asante", "Akuapem", "Fante"]

  # Tone variation
  tone_variation:
    enabled: false # Disabled for basic config
    probability: 0.1
    variation_strength: 0.1

  # Code-switching simulation
  code_switching:
    enabled: false # Disabled for basic config
    probability: 0.1
    languages: ["en", "tw"]

# Augmentation pipeline configuration
pipeline:
  # Processing order (important for some augmentations)
  processing_order:
    - "gaussian_noise"
    - "time_stretch"
    - "pitch_shift"
    - "time_shift"
    - "volume_perturbation"
    - "freq_mask"
    - "time_mask"

  # Batch processing
  batch_processing:
    enabled: true
    batch_size: 32

  # Caching augmented samples
  caching:
    enabled: false # Disabled for basic config
    cache_dir: "data/cache/augmented"
    max_cache_size_gb: 5.0

# Quality control
quality_control:
  # Validate augmented samples
  validate_samples: true

  # Minimum audio quality thresholds
  min_snr_db: 10.0
  max_clipping_ratio: 0.05

  # Reject samples that are too distorted
  reject_distorted: true
  distortion_threshold: 0.8

# Performance optimization
performance:
  # Number of parallel workers for augmentation
  num_workers: 4

  # Augmentation on GPU (if available)
  use_gpu: false

  # Memory optimization
  low_memory_mode: false
  chunk_size: 1024

# Monitoring and logging
monitoring:
  # Log augmentation statistics
  log_stats: true

  # Save augmented samples for inspection
  save_samples: false
  samples_dir: "experiments/augmented_samples"
  num_samples_to_save: 10

# Advanced settings
advanced:
  # Augmentation scheduling
  scheduling:
    enabled: false
    schedule_type: "linear" # linear, exponential, cosine
    start_prob: 0.3
    end_prob: 0.7
    warmup_epochs: 5

  # Adaptive augmentation
  adaptive:
    enabled: false
    adaptation_metric: "val_loss"
    increase_threshold: 0.02
    decrease_threshold: -0.01

  # Multi-stage augmentation
  multi_stage:
    enabled: false
    stages:
      - name: "light"
        epochs: [1, 10]
        augmentation_prob: 0.3
      - name: "medium"
        epochs: [11, 20]
        augmentation_prob: 0.5
      - name: "heavy"
        epochs: [21, 30]
        augmentation_prob: 0.7
