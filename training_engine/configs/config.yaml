# Main Configuration for Twi Speech Recognition Training Engine
# Using Hydra for configuration management

defaults:
  - model: wav2vec2_base
  - data: twi_dataset
  - training: default
  - evaluation: default
  - optimization: adam
  - augmentation: basic
  - _self_

# Project Information
project:
  name: "twi_speech_recognition"
  version: "1.0.0"
  description: "Professional Twi Speech-to-Text Model Training"
  target_wer: 0.30 # Target WER < 30%

# Experiment Tracking
experiment:
  name: "twi_asr_baseline"
  tags: ["twi", "speech_recognition", "wav2vec2"]
  notes: "Baseline training for Twi ASR with target WER < 30%"

# Logging and Monitoring
logging:
  level: "INFO"
  wandb:
    project: "twi-speech-recognition"
    entity: null # Set your wandb entity
    log_model: true
    log_gradients: false
    log_parameters: true
  tensorboard:
    log_dir: "experiments/tensorboard"
    log_model_graph: true

# Hardware Configuration
hardware:
  device: "auto" # auto, cpu, cuda, mps
  mixed_precision: true
  compile_model: false # PyTorch 2.0 compile
  num_workers: 4
  pin_memory: true
  persistent_workers: true

# Paths
paths:
  data_dir: "data"
  model_dir: "models"
  experiment_dir: "experiments"
  cache_dir: "data/cache"
  checkpoint_dir: "models/checkpoints"
  log_dir: "logs"

# Data Sources
data_sources:
  mongodb:
    uri: ${oc.env:MONGODB_URI}
    database: ${oc.env:MONGO_DB_NAME,"twi_speech_data"}
    collections:
      recordings: "audio_recordings"
      speakers: "speakers"

  r2:
    endpoint_url: "https://${oc.env:CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
    access_key: ${oc.env:CLOUDFLARE_ACCESS_KEY_ID}
    secret_key: ${oc.env:CLOUDFLARE_SECRET_ACCESS_KEY}
    bucket_name: ${oc.env:R2_BUCKET_NAME}

# Random Seeds for Reproducibility
seed:
  random: 42
  numpy: 42
  torch: 42
  transformers: 42

# Model Selection Strategy
model_selection:
  metric: "wer" # Primary metric for model selection
  mode: "min" # minimize WER
  patience: 5 # Early stopping patience
  save_top_k: 3 # Save top 3 models

# Validation Strategy
validation:
  strategy: "holdout" # holdout, k_fold, stratified
  test_size: 0.2
  val_size: 0.1
  stratify_by: "dialect" # Ensure balanced dialect representation

# Cross-validation (if strategy is k_fold)
cross_validation:
  n_splits: 5
  shuffle: true
  random_state: 42

# Data Quality Filters
data_filters:
  min_duration: 0.5 # seconds
  max_duration: 30.0 # seconds
  min_transcription_length: 1
  max_transcription_length: 500
  audio_quality_threshold: 0.7
  exclude_empty_transcriptions: true
  exclude_noisy_audio: true

# Language Specific Settings
language:
  code: "tw" # Twi language code
  dialects:
    - "Asante"
    - "Akuapem"
    - "Fante"

  # Twi-specific text preprocessing
  text_preprocessing:
    normalize_tone_marks: true
    standardize_orthography: true
    handle_code_switching: true
    remove_punctuation: false
    lowercase: true

# Performance Targets
targets:
  wer_threshold: 0.30
  training_time_hours: 48
  inference_speed_rtf: 0.1 # Real-time factor < 0.1
  model_size_mb: 500 # Target model size

# Hyperparameter Search
hyperparameter_search:
  enabled: false
  method: "optuna" # optuna, ray_tune, wandb_sweep
  n_trials: 50
  timeout_hours: 24

  # Search space
  search_space:
    learning_rate:
      type: "log_uniform"
      low: 1e-5
      high: 1e-2
    batch_size:
      type: "choice"
      choices: [8, 16, 32]
    warmup_steps:
      type: "int"
      low: 100
      high: 1000

# Deployment Configuration
deployment:
  export_format: ["pytorch", "onnx", "torchscript"]
  quantization: "dynamic" # none, dynamic, static
  optimize_for_mobile: false

# Monitoring and Alerts
monitoring:
  check_interval_minutes: 30
  alert_on_nan_loss: true
  alert_on_poor_performance: true
  memory_usage_threshold: 0.9

  # Slack/Email notifications (optional)
  notifications:
    enabled: false
    webhook_url: null
    email_recipients: []

# Data Privacy and Compliance
privacy:
  anonymize_speaker_ids: true
  exclude_sensitive_content: true
  data_retention_days: 365
  audit_logging: true

# Advanced Settings
advanced:
  gradient_checkpointing: true
  find_unused_parameters: false
  detect_anomaly: false # PyTorch anomaly detection
  profile_memory: false
  profile_compute: false
