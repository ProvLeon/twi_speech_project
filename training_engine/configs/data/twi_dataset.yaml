# Twi Dataset Configuration for Speech Recognition Training
# This configuration handles data loading, preprocessing, and augmentation

dataset:
  _target_: src.data.twi_dataset.TwiSpeechDataset

  # Dataset identification
  name: "twi_speech_corpus"
  version: "1.0.0"
  language: "tw"

  # Data sources
  sources:
    primary: "mongodb"
    backup: "local_files"

  # MongoDB data source
  mongodb:
    connection_uri: ${data_sources.mongodb.uri}
    database: ${data_sources.mongodb.database}
    collections:
      recordings: ${data_sources.mongodb.collections.recordings}
      speakers: ${data_sources.mongodb.collections.speakers}

    # Query filters
    filters:
      transcription_status: "transcribed"
      min_duration: 0.5
      max_duration: 30.0
      exclude_empty_transcriptions: true

    # Caching
    cache_enabled: true
    cache_ttl_hours: 24

  # R2 storage for audio files
  r2_storage:
    endpoint_url: ${data_sources.r2.endpoint_url}
    bucket_name: ${data_sources.r2.bucket_name}
    access_key: ${data_sources.r2.access_key}
    secret_key: ${data_sources.r2.secret_key}

    # Download settings
    parallel_downloads: 8
    retry_attempts: 3
    timeout_seconds: 30

# Audio preprocessing
audio:
  # Target audio format
  target_sample_rate: 16000
  target_channels: 1 # Mono
  target_bit_depth: 16

  # Audio normalization
  normalization:
    method: "peak" # peak, rms, lufs
    target_level: -20.0 # dB

  # Noise reduction
  noise_reduction:
    enabled: true
    method: "spectral_subtraction"
    noise_floor_db: -40

  # Audio quality filtering
  quality_filters:
    min_snr_db: 10
    max_silence_ratio: 0.3
    min_speech_ratio: 0.5

  # Silence trimming
  silence_trimming:
    enabled: true
    threshold_db: -40
    frame_length: 2048
    hop_length: 512

  # Audio validation
  validation:
    check_corruption: true
    check_clipping: true
    max_clipping_ratio: 0.05

# Text preprocessing
text:
  # Basic cleaning
  cleaning:
    remove_extra_whitespace: true
    normalize_unicode: true
    remove_control_characters: true

  # Twi-specific preprocessing
  twi_specific:
    # Orthography standardization
    standardize_orthography: true
    orthography_mappings:
      "ɔ": "ɔ" # Ensure consistent encoding
      "ɛ": "ɛ"
      "ŋ": "ŋ"

    # Tone mark handling
    tone_marks:
      preserve: true
      normalize: true

    # Dialect normalization
    dialect_normalization:
      enabled: true
      target_dialect: "standard"

  # Punctuation handling
  punctuation:
    remove_punctuation: false
    preserve_sentence_endings: true
    normalize_quotes: true

  # Case handling
  case:
    convert_to_lowercase: true
    preserve_proper_nouns: false

  # Number and symbol handling
  numbers:
    convert_digits_to_words: true
    language: "tw"

  # Code-switching handling
  code_switching:
    detect_language_switches: true
    mark_language_boundaries: true
    supported_languages: ["tw", "en"]

# Data splitting strategy
data_split:
  # Split method
  method: "stratified" # random, stratified, speaker_independent

  # Split ratios
  train_ratio: 0.7
  validation_ratio: 0.15
  test_ratio: 0.15

  # Stratification parameters
  stratify_by:
    - "dialect"
    - "gender"
    - "age_range"

  # Speaker-independent split
  speaker_independent:
    enabled: false
    min_speakers_per_split: 5

  # Temporal split (if using time-based splitting)
  temporal_split:
    enabled: false
    cutoff_date: "2024-01-01"

  # Cross-validation
  cross_validation:
    enabled: false
    n_folds: 5
    shuffle: true
    random_state: 42

# Data loading
dataloader:
  # Batch settings
  batch_size: 16
  eval_batch_size: 32

  # Worker settings
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

  # Shuffling
  shuffle_train: true
  shuffle_eval: false

  # Drop last batch
  drop_last: false

  # Timeout
  timeout: 30

  # Collation
  collate_fn: "dynamic_padding" # dynamic_padding, fixed_length

# Data augmentation
augmentation:
  # Training augmentation
  train_augmentation:
    enabled: true
    probability: 0.8

    # Audio augmentations
    audio_augmentations:
      # Time domain
      time_stretch:
        enabled: true
        rate_range: [0.8, 1.2]
        probability: 0.3

      pitch_shift:
        enabled: true
        semitone_range: [-2, 2]
        probability: 0.3

      # Frequency domain
      freq_mask:
        enabled: true
        max_freq_mask: 2
        freq_mask_param: 80
        probability: 0.5

      time_mask:
        enabled: true
        max_time_mask: 2
        time_mask_param: 100
        probability: 0.5

      # Noise injection
      gaussian_noise:
        enabled: true
        noise_factor_range: [0.001, 0.01]
        probability: 0.4

      background_noise:
        enabled: true
        noise_files_path: "data/noise"
        snr_range: [10, 30]
        probability: 0.3

      # Environmental effects
      reverb:
        enabled: true
        room_size_range: [0.1, 0.9]
        probability: 0.2

      # Codec simulation
      codec_simulation:
        enabled: true
        codecs: ["mp3", "aac", "opus"]
        bitrate_range: [64, 320]
        probability: 0.2

    # Text augmentations
    text_augmentations:
      # Character-level
      char_substitution:
        enabled: true
        probability: 0.1
        max_substitutions: 2

      # Word-level
      synonym_replacement:
        enabled: false # Limited for Twi
        probability: 0.1

  # Validation augmentation (usually disabled)
  val_augmentation:
    enabled: false

# Data caching
caching:
  # Cache strategy
  strategy: "memory_and_disk" # memory, disk, memory_and_disk, none

  # Memory cache
  memory_cache:
    max_size_mb: 2048
    eviction_policy: "lru"

  # Disk cache
  disk_cache:
    cache_dir: ${paths.cache_dir}
    max_size_gb: 10
    compression: "lz4"

  # Cache validation
  cache_validation:
    check_integrity: true
    recompute_on_error: true

# Data quality assurance
quality_assurance:
  # Automatic quality checks
  auto_checks:
    enabled: true

    # Audio quality metrics
    audio_checks:
      signal_to_noise_ratio: true
      dynamic_range: true
      clipping_detection: true
      silence_detection: true

    # Text quality metrics
    text_checks:
      character_diversity: true
      word_length_distribution: true
      language_detection: true

  # Manual validation
  manual_validation:
    enabled: false
    sample_rate: 0.05 # 5% of data

  # Quality thresholds
  thresholds:
    min_snr_db: 15
    max_silence_ratio: 0.4
    min_duration_seconds: 1.0
    max_duration_seconds: 25.0
    min_transcription_words: 1
    max_transcription_words: 50

# Metadata handling
metadata:
  # Speaker information
  speaker_info:
    include_demographics: true
    anonymize_ids: true

  # Recording metadata
  recording_info:
    include_session_info: true
    include_device_info: false
    include_environment_info: false

  # Prompt information
  prompt_info:
    include_prompt_category: true
    include_difficulty_level: true

# Data export formats
export:
  formats:
    # HuggingFace datasets
    huggingface:
      enabled: true
      features_config: "automatic"

    # Common Voice format
    common_voice:
      enabled: true
      include_demographics: true

    # Custom JSON format
    json:
      enabled: true
      include_audio_paths: true

    # Kaldi format
    kaldi:
      enabled: false

  # Export settings
  export_settings:
    chunk_size: 1000
    compression: "gzip"
    validate_export: true

# Performance monitoring
performance:
  # Data loading metrics
  monitor_loading_time: true
  monitor_memory_usage: true
  monitor_disk_io: true

  # Bottleneck detection
  detect_bottlenecks: true
  profiling_enabled: false

  # Alerts
  alert_on_slow_loading: true
  loading_time_threshold_seconds: 5.0

# Debugging and development
debug:
  # Development mode
  dev_mode: false

  # Sample data for quick testing
  use_sample_data: false
  sample_size: 100

  # Verbose logging
  verbose_logging: false
  log_data_samples: false

  # Data inspection
  save_data_statistics: true
  plot_data_distribution: false
