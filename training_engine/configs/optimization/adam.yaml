# Adam Optimizer Configuration for Twi Speech Recognition
# This configuration defines the Adam optimizer settings and learning rate scheduling

optimization:
  # Optimizer configuration
  optimizer:
    _target_: torch.optim.AdamW
    lr: 5e-5
    betas: [0.9, 0.999]
    eps: 1e-8
    weight_decay: 0.01
    amsgrad: false

  # Learning rate scheduler
  scheduler:
    _target_: transformers.get_cosine_schedule_with_warmup
    num_warmup_steps: 1000
    num_training_steps: null # Will be calculated based on dataset size
    num_cycles: 0.5
    last_epoch: -1

  # Alternative scheduler options (comment out the above and uncomment one below)
  # Linear warmup with decay
  # scheduler:
  #   _target_: transformers.get_linear_schedule_with_warmup
  #   num_warmup_steps: 1000
  #   num_training_steps: null

  # Polynomial decay
  # scheduler:
  #   _target_: transformers.get_polynomial_decay_schedule_with_warmup
  #   num_warmup_steps: 1000
  #   num_training_steps: null
  #   power: 2.0

  # Constant with warmup
  # scheduler:
  #   _target_: transformers.get_constant_schedule_with_warmup
  #   num_warmup_steps: 1000

  # Learning rate settings
  learning_rate:
    base_lr: 5e-5
    min_lr: 1e-7
    max_lr: 1e-3

    # Warmup configuration
    warmup:
      enabled: true
      warmup_steps: 1000
      warmup_ratio: 0.1 # Alternative to warmup_steps

    # Decay configuration
    decay:
      enabled: true
      decay_factor: 0.5
      decay_patience: 3
      decay_min_lr: 1e-7

  # Gradient optimization
  gradient:
    # Gradient clipping
    clip_grad_norm: 1.0
    clip_grad_value: null

    # Gradient accumulation
    accumulation_steps: 1

    # Gradient scaling (for mixed precision)
    scale_loss: true
    scale_factor: 65536.0

    # Gradient monitoring
    log_grad_norm: true
    detect_anomaly: false

  # Advanced optimization techniques
  advanced:
    # Stochastic Weight Averaging
    swa:
      enabled: false
      swa_start: 0.8 # Start SWA at 80% of training
      swa_freq: 10
      swa_lr: 1e-6

    # Lookahead optimizer
    lookahead:
      enabled: false
      k: 5
      alpha: 0.5

    # Layer-wise learning rate decay
    layer_decay:
      enabled: false
      decay_rate: 0.8

    # Differential learning rates
    differential_lr:
      enabled: false
      encoder_lr: 1e-5
      decoder_lr: 5e-5
      classifier_lr: 1e-4

  # Model-specific optimizations
  model_specific:
    # Wav2Vec2 optimizations
    wav2vec2:
      freeze_feature_encoder_steps: 0
      freeze_base_model_steps: 0
      apply_spec_augment: true
      mask_time_prob: 0.05
      mask_feature_prob: 0.0

    # Whisper optimizations
    whisper:
      freeze_encoder_steps: 0
      freeze_decoder_steps: 0
      gradient_checkpointing: true
      use_cache: false

  # Loss function configuration
  loss:
    # Primary loss
    primary_loss: "ctc" # or "cross_entropy" for seq2seq models

    # Loss weights
    loss_weights:
      ctc_loss: 1.0
      auxiliary_loss: 0.1

    # CTC loss specific
    ctc:
      blank_idx: 0
      reduction: "mean"
      zero_infinity: true

    # Cross-entropy loss specific
    cross_entropy:
      label_smoothing: 0.1
      ignore_index: -100
      reduction: "mean"

    # Auxiliary losses
    auxiliary_losses:
      # Dialect classification loss
      dialect_loss:
        enabled: false
        weight: 0.1

      # Length prediction loss
      length_loss:
        enabled: false
        weight: 0.05

  # Training stability
  stability:
    # Automatic mixed precision
    amp:
      enabled: true
      opt_level: "O1"
      loss_scale: "dynamic"

    # Batch size adaptation
    batch_size_adaptation:
      enabled: false
      target_loss: null
      increase_factor: 1.2
      decrease_factor: 0.8

    # Learning rate finder
    lr_finder:
      enabled: false
      start_lr: 1e-8
      end_lr: 1e-1
      num_training_steps: 100

  # Early stopping
  early_stopping:
    enabled: true
    patience: 10
    monitor: "val_wer"
    mode: "min"
    min_delta: 0.001

  # Checkpoint management
  checkpointing:
    save_every_n_epochs: 5
    save_every_n_steps: null
    save_best_only: false
    save_last: true
    save_top_k: 3
    monitor: "val_wer"
    mode: "min"

  # Hyperparameter search
  hyperparameter_search:
    enabled: false
    method: "optuna" # optuna, ray_tune, wandb_sweep

    # Search space
    search_space:
      learning_rate:
        type: "log_uniform"
        low: 1e-6
        high: 1e-3
      weight_decay:
        type: "log_uniform"
        low: 1e-5
        high: 1e-1
      warmup_steps:
        type: "int"
        low: 100
        high: 2000

  # Logging and monitoring
  logging:
    log_every_n_steps: 100
    log_learning_rate: true
    log_loss_components: true
    log_gradient_norm: true

    # Wandb logging
    wandb:
      log_optimizer_state: false
      log_gradients: false
      log_parameters: false

    # TensorBoard logging
    tensorboard:
      log_optimizer_state: false
      log_gradients: false
      log_histograms: false

# Optimizer-specific configurations for different model types
model_optimizers:
  wav2vec2:
    optimizer:
      _target_: torch.optim.AdamW
      lr: 5e-5
      weight_decay: 0.01
    scheduler:
      _target_: transformers.get_cosine_schedule_with_warmup
      num_warmup_steps: 1000

  whisper:
    optimizer:
      _target_: torch.optim.AdamW
      lr: 1e-5
      weight_decay: 0.01
    scheduler:
      _target_: transformers.get_linear_schedule_with_warmup
      num_warmup_steps: 500

  custom:
    optimizer:
      _target_: torch.optim.AdamW
      lr: 3e-5
      weight_decay: 0.01
    scheduler:
      _target_: transformers.get_cosine_schedule_with_warmup
      num_warmup_steps: 800
